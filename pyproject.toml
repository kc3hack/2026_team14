[project]
name = "2026-team14"
version = "0.1.0"
description = "KC3Hack 2026 Team14"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5",
    "django-environ>=0.12.1",
    "django-pwa>=2.0.1",
    "django-storages[boto3]>=1.14.6",
    "pillow>=12.1.1",
    "psycopg[binary]>=3.3.2",
    "requests>=2.32.5",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = ["poethepoet>=0.41.0"]
[tool.poe.tasks]
dev = "python manage.py runserver"
migrate = "python manage.py migrate"
admin = "python manage.py createsuperuser"
up = "docker compose up -d"
down = "docker compose down"

[tool.poe.tasks.setup]
sequence = [
    { cmd = "python -c 'import shutil, os; not os.path.exists(\".env\") and shutil.copy(\".env.example\", \".env\") and print(\"Created .env from example\")'" },
    { cmd = "docker compose up -d" },
    { cmd = "python manage.py wait_for_db" },
    { cmd = "python manage.py migrate" },
    { cmd = "echo 'Setup Completed!'" },
]
