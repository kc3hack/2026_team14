services:
  web:
    image: ghcr.io/kc3hack/2026_team14-web:latest
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
  nginx:
    image: ghcr.io/kc3hack/2026_team14-nginx:latest
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - static_volume:/app/static
    depends_on:
      - web
    env_file:
      - stack.env
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-kc3hack-2026-team14}
    env_file:
      - stack.env
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: always
    depends_on:
      - nginx
    command: >
      sh -c "mkdir -p /var/run/tailscale &&
             tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
             sleep 5 &&
             tailscale up --authkey=$${TS_AUTHKEY} --hostname=$${TS_HOSTNAME} --accept-routes --advertise-tags=tag:web-public &&
             tailscale funnel --bg http://nginx:80 &&
             wait"
  db:
    image: postgis/postgis:16-3.4
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    env_file:
      - stack.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio
    restart: always
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    env_file:
      - stack.env
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - stack.env
    entrypoint: >
      /bin/sh -c " until mc alias set myminio http://minio:9000 \${MINIO_ROOT_USER} \${MINIO_ROOT_PASSWORD}; do echo 'Waiting...'; sleep 1; done; mc mb myminio/\${MINIO_BUCKET_NAME} || true; mc anonymous set download myminio/\${MINIO_BUCKET_NAME}; exit 0; "

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - stack.env
    environment:
      DOCKER_API_VERSION: "1.44"
      REPO_USER: ${GH_USERNAME}
      REPO_PASS: ${GH_PAT}
    command: --label-enable --interval 20 --cleanup
    restart: always
volumes:
  postgres_data:
  minio_data:
  static_volume:
  tailscale_data:
