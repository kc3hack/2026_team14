<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KC3Hack 2026 Team14 App</title>

    {% load pwa %}
    {% progressive_web_app_meta %}

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    {% load static %}
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <!-- Django CSRF Token -->
    <form style="display:none">{% csrf_token %}</form>

    <!-- Fullscreen Map Container -->
    <div id="map"></div>

    <!-- Floating Action Buttons -->
    <div class="fab-container">
        <!-- Collection Button -->
        <button id="btn-collection" class="fab" title="コレクション">
            <i class="fa-solid fa-layer-group"></i>
        </button>
        <!-- Take Photo Button -->
        <button id="btn-camera" class="fab" title="写真を撮る">
            <i class="fa-solid fa-camera"></i>
        </button>
        <!-- Add Photo Button -->
        <button id="btn-gallery" class="fab" title="写真を追加">
            <i class="fa-regular fa-image"></i>
        </button>
        <!-- Location Record Button -->
        <button id="btn-record" class="fab" title="現在地を記録">
            <i class="fa-solid fa-map-pin"></i>
        </button>
    </div>

    <!-- Context Menu for Map -->
    <div id="context-menu-map" class="context-menu">
        <div class="context-menu-item" id="menu-map-add-photo">
            <i class="fa-solid fa-camera"></i> 写真ありで場所を追加
        </div>
        <div class="context-menu-item" id="menu-map-add-poi">
            <i class="fa-solid fa-location-dot"></i> 写真なしで場所を追加
        </div>
    </div>

    <!-- Context Menu for Pins -->
    <div id="context-menu-pin" class="context-menu">
        <div class="context-menu-item" id="menu-pin-edit">
            <i class="fa-solid fa-pen"></i> 編集・詳細を見る
        </div>
        <div class="context-menu-item" id="menu-pin-delete">
            <i class="fa-solid fa-trash" style="color: #e74c3c;"></i> 削除する
        </div>
    </div>

    <!-- Add Location Modal -->
    <div id="add-location-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">スポットを追加</h3>
            <div class="form-group">
                <label>スポット名</label>
                <input type="text" id="spot-name" class="form-control" placeholder="例：お気に入りスポット">
            </div>
            <div class="form-group">
                <label>訪問日時</label>
                <input type="datetime-local" id="visit-datetime" class="form-control">
            </div>
            <div class="form-actions">
                <button id="btn-cancel-add" class="btn btn-secondary">キャンセル</button>
                <button id="btn-confirm-add" class="btn btn-primary">追加する</button>
            </div>
        </div>
    </div>

    <!-- Bottom Sheet (Semi-Modal for Collections) -->
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-drag-handle">
            <div class="sheet-drag-indicator"></div>
        </div>
        <div class="sheet-content">
            <h2>コレクション</h2>
            <p>ここに保存したルートや観光地、写真のコレクションリストが表示されます。</p>
            <div class="collection-list">
                <div class="collection-item">
                    <i class="fa-solid fa-map-location-dot"></i> 大阪城散策ルート
                </div>
                <div class="collection-item">
                    <i class="fa-solid fa-camera-retro"></i> グルメ巡りコレクション
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Custom JS -->
    <script src="{% static 'js/app.js' %}"></script>
</body>

</html>
