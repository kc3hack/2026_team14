<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>World Borders</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  const map = L.map("map").setView([20, 0], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // 国境ポリゴン（GeoJSON）を表示
  fetch("/worldborders.geojson")
    .then(r => r.json())
    .then(gj => L.geoJSON(gj).addTo(map));

  // クリックした場所にピンを打つ（1個だけ置き換え）
  let marker = null;
  map.on("click", (e) => {
    const { lat, lng } = e.latlng;

    if (marker) marker.remove();              // 既存ピンを消す
    marker = L.marker([lat, lng]).addTo(map); // 新しいピン
    marker.bindPopup(`lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`).openPopup();
  });
</script>
</body>
</html>
